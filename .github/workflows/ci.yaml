name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  svelteCheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Svelte Check
        run: pnpm run check
    env:
      SUPABASE_SERVICE_KEY: temp-value-for-SUPABASE_SERVICE_KEY
      PUB_VITE_SUPABASE_URL: temp-value-for-PUB_VITE_SUPABASE_URL
      PUB_ARGYLE_LINK_URL: temp-value-for-PUB_ARGYLE_LINK_URL
      SUPABASE_DEFAULT_PASSWORD: temp-value-for-SUPABASE_DEFAULT_PASSWORD
      PUB_VITE_SUPABASE_ANON_KEY: temp-value-for-PUB_VITE_SUPABASE_ANON_KEY
      PUB_VITE_TWILIO_SID: AC123456789
      VITE_TWILIO_TOKEN: temp-value-for-VITE_TWILIO_TOKEN
      VITE_TWILIO_NUMBER: temp-value-for-VITE_TWILIO_NUMBER
      ARGYLE_WEBHOOK_SECRET: test-webhook-secret
      ARGYLE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      INTERNAL_API_SECRET: temp-value-for-INTERNAL_API_SECRET
      PUB_SUPPORT_EMAIL: help@getsystem.org
      PUB_IRB_EMAIL: irb@university.edu

  formatAndLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format
      - name: Check linting
        run: pnpm lint

  types:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start Supabase local development setup
        run: npx supabase start
      - name: Generate types and format them
        run: |
          npx supabase gen types typescript --local > src/lib/schema.ts
          pnpm run format:fix
      - name: Verify types are up to date
        run: |
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/lib/schema.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi
    env:
      VITE_TWILIO_TOKEN: 'temp-value-for-ci'

  vitest:
    runs-on: ubuntu-22.04
    environment: Testing
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          # NOTE: This throws loads of errors when we update it to '22.14.0'.
          # Upgrading to '24.9.0' works perfectly, but v24 isn't yet supported by Netlify.
          # See ENG-371
          node-version: '24.9.0'
          cache: 'pnpm'
      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-${{ runner.os }}-${{ hashFiles('supabase/**/*') }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.19.5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Supabase
        run: |
          supabase start
          supabase status --output env >> tempenv.txt
          sed -e '/^API_URL/s//PUB_VITE_SUPABASE_URL/' -e '/^SERVICE_ROLE_KEY/s//SUPABASE_SERVICE_KEY/' -e '/^ANON_KEY/s//PUB_VITE_SUPABASE_ANON_KEY/' tempenv.txt >> .env
          supabase db reset
      - name: Run tests
        run: pnpm run test
      # Database-level regressions (locking, cascades, concurrent writes) that
      # the TypeScript suite cannot reach. Previously runnable only by hand, so
      # nothing caught a regression in them.
      - name: Run database RBAC regressions
        run: pnpm run test:db-regressions
    env:
      PUB_VITE_TWILIO_SID: AC123456789
      VITE_TWILIO_TOKEN: abcdefghijklmnopqrstuvwxyz
      INTERNAL_API_SECRET: test-internal-api-secret
      ARGYLE_WEBHOOK_SECRET: ${{ secrets.ARGYLE_WEBHOOK_SECRET }}
      ARGYLE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PUB_SUPPORT_EMAIL: help@getsystem.org
      PUB_IRB_EMAIL: irb@university.edu

  # Split playwright tests into 2 parallel jobs
  playwright-setup:
    runs-on: ubuntu-22.04
    environment: Testing
    outputs:
      test-matrix: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Create test matrix
        id: create-matrix
        run: echo "matrix=[1, 2]" >> $GITHUB_OUTPUT

  playwright:
    needs: playwright-setup
    runs-on: ubuntu-22.04
    environment: Testing
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.playwright-setup.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      # Improved Caching Strategy
      - name: Cache PNPM store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ hashFiles('playwright.config.ts') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-${{ runner.os }}-${{ hashFiles('supabase/**/*') }}

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            .svelte-kit
            build
          key: build-${{ runner.os }}-${{ github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.19.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (if needed)
        run: npx playwright install --with-deps chromium

      - name: Set up Supabase
        run: |
          supabase start
          supabase status --output env >> tempenv.txt
          sed -e '/^API_URL/s//PUB_VITE_SUPABASE_URL/' -e '/^SERVICE_ROLE_KEY/s//SUPABASE_SERVICE_KEY/' -e '/^ANON_KEY/s//PUB_VITE_SUPABASE_ANON_KEY/' tempenv.txt >> .env
          supabase db reset
        env:
          SUPABASE_CACHE: true

      - name: Build app
        # PUB_ARGYLE_LINK_URL is inlined at build time by Vite, so the stub URL
        # has to be set here for the app to talk to tests/argyleStub.ts.
        # ARGYLE_LIVE=1 (locally) builds against the real sandbox instead.
        run: pnpm run build
        env:
          PUB_ARGYLE_LINK_URL: http://127.0.0.1:4180

      - name: Run e2e tests (sharded)
        run: npm run test:e2e:ci
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_TOTAL_SHARDS: 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7 # Reduced from 30 to save storage
    env:
      VITE_ARGYLE_API_KEY: ${{ secrets.VITE_ARGYLE_API_KEY }}
      VITE_ARGYLE_API_SECRET: ${{ secrets.VITE_ARGYLE_API_SECRET }}
      # The suite runs against tests/argyleStub.ts; see playwright.config.ts.
      PUB_ARGYLE_LINK_URL: http://127.0.0.1:4180
      PUB_VITE_TWILIO_SID: AC123456789
      SUPABASE_DEFAULT_PASSWORD: temp-value-for-SUPABASE_DEFAULT_PASSWORD
      VITE_TWILIO_NUMBER: temp-value-for-VITE_TWILIO_NUMBER
      VITE_TWILIO_TOKEN: temp-value-for-VITE_TWILIO_TOKEN
      ARGYLE_WEBHOOK_SECRET: ${{ secrets.ARGYLE_WEBHOOK_SECRET }}
      ARGYLE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      INTERNAL_API_SECRET: test-internal-api-secret
      PUB_SUPPORT_EMAIL: help@getsystem.org
      PUB_IRB_EMAIL: irb@university.edu
